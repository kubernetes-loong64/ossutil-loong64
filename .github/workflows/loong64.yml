name: loong64
on:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    outputs:
      RAW_VERSION: ${{ steps.extract.outputs.RAW_VERSION }}
      OSSUTIL_REF: ${{ steps.extract.outputs.OSSUTIL_REF }}
      RELEASE: ${{ steps.extract.outputs.RELEASE }}
      IS_STABLE: ${{ steps.extract.outputs.IS_STABLE }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract version
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          RAW_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "RAW_VERSION=$RAW_VERSION"
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_ENV}
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_OUTPUT}
          OSSUTIL_REF=$(echo $RAW_VERSION | awk -F'+' '{print $1}')
          echo "OSSUTIL_REF=$OSSUTIL_REF"
          echo "OSSUTIL_REF=$OSSUTIL_REF" >> ${GITHUB_ENV}
          echo "OSSUTIL_REF=$OSSUTIL_REF" >> ${GITHUB_OUTPUT}
          RELEASE=$(echo $RAW_VERSION | awk -F'+' '{print $2}')
          RELEASE=${RELEASE:-alpha.${{ github.run_number }}}
          echo "RELEASE=$RELEASE"
          echo "RELEASE=$RELEASE" >> ${GITHUB_ENV}
          echo "RELEASE=$RELEASE" >> ${GITHUB_OUTPUT}
          if echo "$RAW_VERSION" | grep -qE '[+].*(alpha|beta|rc)'; then
            IS_STABLE=false
          else
            IS_STABLE=true
          fi
          echo "IS_STABLE=$IS_STABLE"
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_OUTPUT}
      - name: Install build tools
        run: |
          apt update
          apt install -y git make golang file
      - name: Clone ossutil
        run: |
          git clone --branch ${{ env.OSSUTIL_REF }} --depth 1 https://github.com/aliyun/ossutil.git ossutil
      - name: ls
        run: ls -lah
      - name: Build ossutil
        working-directory: ossutil
        env:
          GOOS: linux
          GOARCH: loong64
        run: |
          go build
      - name: Print binary SHA-256 checksums
        working-directory: ossutil
        run: |
          sha256sum ossutil
      - name: Inspect binary file types
        run: |
          echo "=== bin ==="
          file ossutil/ossutil
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ossutil-loong64-binaries
          path: |
            ossutil/ossutil
      - name: Export system version
        run: |
          cat /etc/os-release > /tmp/build-os-release.txt
          cat /tmp/build-os-release.txt
      - name: Export installed packages
        run: |
          dpkg -l > /tmp/build-installed-packages.txt
          cat /tmp/build-installed-packages.txt
      - name: Upload system info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ossutil-loong64-system-info
          path: |
            /tmp/build-installed-packages.txt
            /tmp/build-os-release.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IS_STABLE: ${{ needs.build.outputs.IS_STABLE }}
      BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossutil-loong64-binaries
          path: loong64-artifacts
      - name: Download system info
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ossutil-loong64-system-info
          path: loong64-artifacts
      - name: List release artifacts
        run: |
          find loong64-artifacts -type f
      - name: Import GPG key
        run: |
          export LANG=C.UTF-8
          echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import > /dev/null
          echo "$(gpg --list-secret-keys --keyid-format LONG | grep -Eo '[A-F0-9]{40}' | head -1):6:" | gpg --import-ownertrust
      - name: Sign artifacts
        run: |
          find loong64-artifacts -type f | while read -r file; do
            gpg --batch --detach-sign --armor "$file"
            echo "Signed: $file"
            gpg --verify "$file".asc "$file"
          done
      - name: Generate release body
        run: |
          cat > release-body.md <<'BODYEOF'
          ## Artifacts

          | File       | Download                               |
          |------------|----------------------------------------|
          | `ossutil`  | [ossutil](${{ env.BASE_URL }}/ossutil) |

          Each file has a corresponding `.asc` detached GPG signature.

          ```shell
          # Binary
          curl -LO ${{ env.BASE_URL }}/ossutil
          curl -LO ${{ env.BASE_URL }}/ossutil.asc

          chmod +x ossutil
          ```

          ## Verifying releases

          ```shell
          gpg --keyserver keys.openpgp.org --recv-keys FCF8724722CCBF9F51B1FBE376532BE7E3013105
          echo "FCF8724722CCBF9F51B1FBE376532BE7E3013105:6:" | gpg --import-ownertrust
          gpg --verify <file>.asc <file>
          ```
          BODYEOF
      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ env.IS_STABLE == 'false' }}
          make_latest: ${{ env.IS_STABLE == 'true' && 'legacy' || 'false' }}
          files: |
            loong64-artifacts/**
